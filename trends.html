<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#fff4f6;
color:#333;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:22px 8%;
background:white;
box-shadow:0 2px 15px rgba(0,0,0,0.05);
}

.logo{
font-family:'Playfair Display',serif;
font-size:34px;
font-weight:700;
color:#d48ca2;
}

nav ul{
display:flex;
gap:30px;
list-style:none;
}

nav a{
text-decoration:none;
color:#444;
font-weight:500;
}

.hero{
padding:120px 20px;
text-align:center;
background:linear-gradient(to right,#fff1f4,#fde8ee);
}

.hero h1{
font-size:64px;
font-family:'Playfair Display',serif;
margin-bottom:20px;
}

.pinterest-grid{
padding:100px 8%;
column-count:3;
column-gap:25px;
}

.pin{
background:white;
margin-bottom:25px;
border-radius:25px;
overflow:hidden;
break-inside:avoid;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.pin img{
width:100%;
display:block;
}

.pin-content{
padding:20px;
}

.pin-content h3{
margin-bottom:12px;
font-size:24px;
}

.pin-content a{
display:inline-block;
padding:10px 22px;
background:#d48ca2;
color:white;
text-decoration:none;
border-radius:25px;
}

footer{
text-align:center;
padding:40px;
background:white;
}

@media(max-width:768px){

.pinterest-grid{
column-count:1;
}

.hero h1{
font-size:42px;
}

}

</style>

</head>
